<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiciDashboard - 21 Speeds</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #00e676;
            --gear-accent: #ffb74d;
            --text-color: #ffffff;
            --subtext: #b0bec5;
            --danger: #ff5252;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .full-width {
            grid-column: span 2;
        }

        .gear-card {
            background-color: #262626;
            border: 2px solid var(--gear-accent);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
        }

        .metric-title {
            font-size: 0.8rem;
            color: var(--subtext);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .metric-unit {
            font-size: 0.9rem;
            color: var(--subtext);
        }

        .gear-display {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 12px 0;
        }

        .gear-box {
            background: #181818;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #444;
        }

        .gear-num {
            font-size: 2rem;
            font-weight: bold;
            color: var(--gear-accent);
        }

        .terrain-selector {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .terrain-btn {
            flex: 1;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .terrain-btn.active {
            background: var(--gear-accent);
            color: #000;
            font-weight: bold;
        }

        button.primary-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
        }

        button.danger {
            background-color: var(--danger);
            color: #fff;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-link {
            display: block;
            background: var(--card-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚴 Bike Dashboard 21V</h1>
    </header>

    <!-- Asistente Detector de Cambios (21 Velocidades) -->
    <div class="gear-card">
        <div class="metric-title" style="color: var(--gear-accent);">⚙️ Asistente de Cambios (3x7)</div>
        
        <div class="gear-display">
            <div class="gear-box">
                <div class="metric-title">Plato (Frente)</div>
                <div class="gear-num" id="recommendedChainring">2</div>
                <div class="metric-unit" id="chainringDesc">Medio (32T)</div>
            </div>
            <div style="font-size: 1.5rem; color: var(--subtext);">+</div>
            <div class="gear-box">
                <div class="metric-title">Piñón (Atrás)</div>
                <div class="gear-num" id="recommendedCog">4</div>
                <div class="metric-unit" id="cogDesc">Medio</div>
            </div>
        </div>

        <div id="gearAdvice" style="font-size: 0.9rem; font-weight: bold; margin-bottom: 8px;">
            Marcha recomendada para ritmo moderado
        </div>

        <!-- Selector Manual de Terreno/Pendiente -->
        <div class="terrain-selector">
            <button class="terrain-btn" id="btnClimb" onclick="setTerrain('climb')">⛰️ Subida</button>
            <button class="terrain-btn active" id="btnFlat" onclick="setTerrain('flat')">🚴 Plano</button>
            <button class="terrain-btn" id="btnDown" onclick="setTerrain('down')">📉 Bajada</button>
        </div>
    </div>

    <!-- Velocímetro y Métricas GPS -->
    <div class="grid">
        <div class="card full-width">
            <div class="metric-title">Velocidad Actual</div>
            <div class="metric-value" id="speed">0.0</div>
            <div class="metric-unit">km/h</div>
            <button id="gpsBtn" class="primary-btn" onclick="toggleGPS()">Activar GPS / Velocímetro</button>
        </div>

        <div class="card">
            <div class="metric-title">Distancia</div>
            <div class="metric-value" id="distance" style="font-size: 1.8rem;">0.00</div>
            <div class="metric-unit">km</div>
        </div>

        <div class="card">
            <div class="metric-title">Tiempo</div>
            <div class="metric-value" id="timer" style="font-size: 1.8rem;">00:00</div>
            <div class="metric-unit">min:seg</div>
        </div>
    </div>

    <!-- Accesos Rápidos -->
    <div class="quick-actions">
        <a href="https://www.google.com/maps" target="_blank" class="action-link">🗺️ Mapas</a>
        <a href="tel:911" class="action-link" style="color: var(--danger); border-color: var(--danger);">🚨 Emergencia</a>
    </div>

    <script>
        let watchId = null;
        let totalDistance = 0;
        let lastPos = null;
        let timerInterval = null;
        let seconds = 0;
        let currentTerrain = 'flat'; // 'climb', 'flat', 'down'
        let currentKmh = 0;

        // Lógica de cálculo de los 21 Cambios (Plato 1-3, Piñón 1-7)
        function updateGearRecommendation(kmh) {
            let chainring = 2; // 1: Pequeño, 2: Medio, 3: Grande
            let cog = 4;        // 1 (más grande/fácil) a 7 (más pequeño/rápido)
            let advice = "";

            // Ajuste por Terreno
            if (currentTerrain === 'climb') {
                if (kmh < 10) {
                    chainring = 1; cog = 1; // 1x1 o 1x2
                    advice = "Subida empinada: Usa desarrollo suave para no agotar piernas.";
                } else if (kmh < 18) {
                    chainring = 1; cog = 3;
                    advice = "Subida moderada: Mantén cadencia constante.";
                } else {
                    chainring = 2; cog = 3;
                    advice = "Subida ligera a buen ritmo.";
                }
            } else if (currentTerrain === 'down') {
                if (kmh > 28) {
                    chainring = 3; cog = 7;
                    advice = "Bajada rápida: Desarrollo máximo para evitar pedalear en el aire.";
                } else {
                    chainring = 3; cog = 5;
                    advice = "Bajada/Inercia: Mantén tracción en los pedales.";
                }
            } else { // Plano
                if (kmh < 8) {
                    chainring = 1; cog = 3;
                    advice = "Arrancando / Velocidad muy baja.";
                } else if (kmh < 15) {
                    chainring = 2; cog = 3;
                    advice = "Ritmo suave / Paseo.";
                } else if (kmh < 22) {
                    chainring = 2; cog = 4;
                    advice = "Ritmo crucero ideal para plano.";
                } else if (kmh < 28) {
                    chainring = 2; cog = 6;
                    advice = "Velocidad media-alta sostenida.";
                } else {
                    chainring = 3; cog = 6;
                    advice = "Velocidad alta: Pasa a plato grande.";
                }
            }

            // Actualizar interfaz de cambios
            document.getElementById('recommendedChainring').innerText = chainring;
            document.getElementById('recommendedCog').innerText = cog;
            document.getElementById('gearAdvice').innerText = advice;

            // Etiquetas descriptivas
            const chainringLabels = ["1 - Pequeño (Fuerza)", "2 - Medio (Paseo)", "3 - Grande (Velocidad)"];
            document.getElementById('chainringDesc').innerText = chainringLabels[chainring - 1];
            document.getElementById('cogDesc').innerText = `Piñón ${cog} (de 7)`;
        }

        function setTerrain(type) {
            currentTerrain = type;
            document.getElementById('btnClimb').classList.remove('active');
            document.getElementById('btnFlat').classList.remove('active');
            document.getElementById('btnDown').classList.remove('active');

            if (type === 'climb') document.getElementById('btnClimb').classList.add('active');
            if (type === 'flat') document.getElementById('btnFlat').classList.add('active');
            if (type === 'down') document.getElementById('btnDown').classList.add('active');

            updateGearRecommendation(currentKmh);
        }

        // GPS y Velocímetro
        function toggleGPS() {
            const btn = document.getElementById('gpsBtn');
            if (watchId === null) {
                if ("geolocation" in navigator) {
                    watchId = navigator.geolocation.watchPosition(updatePosition, handleError, {
                        enableHighAccuracy: true,
                        maximumAge: 1000
                    });
                    startTimer();
                    btn.innerText = "Detener GPS";
                    btn.classList.add('danger');
                } else {
                    alert("Tu navegador no soporta geolocalización.");
                }
            } else {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                stopTimer();
                btn.innerText = "Activar GPS / Velocímetro";
                btn.classList.remove('danger');
            }
        }

        function updatePosition(pos) {
            let speed = pos.coords.speed;
            if (speed === null || speed < 0) speed = 0;
            currentKmh = parseFloat((speed * 3.6).toFixed(1));
            
            document.getElementById('speed').innerText = currentKmh;

            // Actualizar la recomendación de cambios en tiempo real
            updateGearRecommendation(currentKmh);

            // Distancia
            if (lastPos) {
                let dist = getDistance(
                    lastPos.coords.latitude, lastPos.coords.longitude,
                    pos.coords.latitude, pos.coords.longitude
                );
                if (currentKmh > 1.0) {
                    totalDistance += dist;
                    document.getElementById('distance').innerText = totalDistance.toFixed(2);
                }
            }
            lastPos = pos;
        }

        function handleError(err) {
            console.warn('GPS Error (' + err.code + '): ' + err.message);
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Cronómetro
        function startTimer() {
            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    seconds++;
                    let mins = Math.floor(seconds / 60);
                    let secs = seconds % 60;
                    document.getElementById('timer').innerText = 
                        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }, 1000);
            }
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    </script>
</body>
</html>
